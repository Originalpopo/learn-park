<title>สนามเด็กเรียน</title>
<link rel="apple-touch-icon" href="shared/img/icon/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="shared/img/icon/icon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="shared/img/icon/icon-512.png">
<meta name="apple-mobile-web-app-title" content="สนามเด็กเรียน">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FBF7EC">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600&family=Mitr:wght@400;500;600&display=swap">
<link rel="stylesheet" href="shared/core.css">
<style>
/* Home as a game: a little skate park with the child's chosen skater, then a winding level map, one park zone per chapter. */
.app { gap: 22px; }

/* top bar */
.home-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
/* the logo is the child's own skater; tap it to change character */
.brand .me { width: 66px; height: 66px; flex: none; margin: -8px 0; display: block; filter: drop-shadow(0 4px 3px rgba(43, 38, 32, .2)); }
.brand .name { font-family: var(--display); font-size: 1.2rem; line-height: 1.1; }
.brand .sub { font-size: .75rem; color: var(--muted); }
.lv { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 16px 0 6px; border-radius: 999px; background: var(--ink); color: #fff; font-family: var(--display); }   /* the one dark piece on purpose (owner's choice) */
.lv .badge-lv { width: 36px; height: 36px; border-radius: 50%; background: var(--yellow); color: var(--ink); display: grid; place-items: center; font-size: .95rem; }
.lv .meter { width: 86px; height: 8px; border-radius: 4px; background: #4A443B; overflow: hidden; }
.lv .meter i { display: block; height: 100%; background: var(--yellow); border-radius: 4px; }
.lv .exp { font-size: .85rem; white-space: nowrap; }

/* hero */
.hero { display: grid; grid-template-columns: 1fr 1.05fr; gap: 12px; align-items: center; }
.hero-text { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.pill { align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px 6px 8px; border-radius: 999px; background: var(--card); border: 2px solid var(--line); font-size: .95rem; }
.pill b { background: var(--yellow); border-radius: 999px; padding: 0 10px; font-family: var(--display); font-weight: 500; font-size: .85rem; }
.hero h1 { font-size: clamp(2.6rem, 7.4vw, 4.4rem); line-height: 1.12; font-weight: 600; letter-spacing: -.01em; }
.hero h1 .slab { display: inline-block; background: var(--yellow); padding: 0 .28em .04em; border-radius: .22em; box-shadow: 0 .09em 0 var(--yellow-deep); transform: rotate(-2deg); margin-top: .1em; }
.hero p.lead { font-size: 1.15rem; color: var(--muted); max-width: 30em; }
.hero-btns { display: flex; gap: 12px; flex-wrap: wrap; }
.hero-btns .btn { min-height: 62px; font-size: 1.15rem; }
.scene-wrap { position: relative; min-width: 0; }
/* hero scene: one painted title picture (tools/incoming/hero.webp, background made see-through) with an empty
   middle, where the child's skater (a Kenney "Mini Skate" render) stands as a button */
.scene { position: relative; width: 100%; aspect-ratio: 1; touch-action: manipulation; }
.scene .art { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; user-select: none; -webkit-user-drag: none; }
.kid { position: absolute; left: 29%; top: 27%; width: 42%; padding: 0; border: 0; background: none; cursor: pointer; }
.kid img { width: 100%; height: auto; display: block; filter: drop-shadow(0 8px 4px rgba(43, 38, 32, .2)); }
.kid .ride-in { display: block; position: relative; animation: roll 2.8s ease-in-out infinite; }   /* rolls to and fro like the skater on the map */
.kid .shadow { position: absolute; left: 22%; right: 22%; bottom: 8%; height: 8%; border-radius: 50%; background: #000; opacity: .12; }
.bubble { z-index: 5;
  position: absolute; left: 50%; bottom: calc(70% + 10px); transform: translateX(-50%);   /* tail tip just above the skater's cap */
  background: var(--card); border: 2px solid var(--line); border-radius: 20px; padding: 8px 16px;
  font-family: var(--display); font-size: 1.05rem; width: max-content; max-width: 92%; text-align: center; box-shadow: 0 4px 0 var(--line);
  transition: opacity .25s, transform .25s;
}
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -12px; width: 18px; height: 18px; background: var(--card); border-right: 2px solid var(--line); border-bottom: 2px solid var(--line); transform: translateX(-50%) rotate(45deg); }
.bubble { animation: float 3s ease-in-out infinite; }
@keyframes float { 50% { transform: translateX(-50%) translateY(-4px); } }
.bubble.pop { animation: pop .35s cubic-bezier(.3, 1.6, .5, 1), float 3s ease-in-out .35s infinite; }
@keyframes pop { from { transform: translateX(-50%) scale(.85); } }
.bubble.hide { opacity: 0; transition-duration: .12s; }
/* two small twinkling stars beside the painted ones */
.spark { position: absolute; display: block; height: auto; pointer-events: none; animation: twinkle 2.2s ease-in-out infinite; }
.spark.t2 { animation-delay: -1.1s; }
@keyframes twinkle { 50% { transform: scale(.5); opacity: .4; } }
.s-tw1 { left: 1%; top: 37%; width: 5%; }
.s-tw2 { left: 93%; top: 32%; width: 4.5%; }

/* scene animation */
.bob { animation: bob 2.6s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-8px); } }
.kid.jump img { animation: jump .6s cubic-bezier(.3, 1.5, .5, 1); }
@keyframes jump { 40% { transform: translateY(-34%) rotate(-8deg); } }


/* stats */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.stat { background: var(--card); border: 2px solid var(--line); border-radius: 22px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
.stat .ic { width: 48px; height: 48px; border-radius: 16px; display: grid; place-items: center; flex: none; }
.stat .ic img { width: 34px; height: 34px; }
.stat .num { font-family: var(--display); font-size: 1.7rem; line-height: 1; font-variant-numeric: tabular-nums; }
.stat .lbl { font-size: .9rem; color: var(--muted); }

/* level map */
.map-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
/* worlds: each chapter is one zone of the skate park (ramps / rails / bowl), drawn as a painted park picture.
   The base picture holds the plaza; every stop is its own layer on top, so locked ones can turn grey. */
/* chapters sit side by side in a swipe slider (no frames); under it, arrows around the current chapter's name */
.chap-nav { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: -8px; }
.chap-nav .arrow { width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--line); background: var(--card); color: var(--ink); font-family: var(--display); font-size: 1.6rem; line-height: 1; display: grid; place-items: center; padding: 0 0 4px; box-shadow: 0 4px 0 var(--line); flex: none; }
.chap-nav .arrow:disabled { opacity: .3; box-shadow: none; }
.chap-nav .chap-name { min-width: 190px; text-align: center; font-family: var(--display); font-size: 1.15rem; line-height: 1.3; }
.chap-nav .chap-name small { display: block; font-family: var(--body, inherit); font-size: .8rem; color: var(--muted); }
.slider { display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; overscroll-behavior-x: contain; scrollbar-width: none; margin-top: -6px; }
.slider::-webkit-scrollbar { display: none; }
.world { flex: 0 0 100%; min-width: 0; overflow: clip; scroll-snap-align: start; scroll-snap-stop: always; position: relative; padding: 4px 2px 8px; }
.park { position: relative; max-width: 820px; margin: calc(min(100%, 820px) * -.02) auto calc(min(100%, 820px) * -.06); }   /* trim the empty paper above and below the island */
.park > img.base { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.park .layer { position: absolute; display: block; height: auto; padding: 0; border: 0; background: none; cursor: pointer; }
.park .over { position: absolute; inset: 0; pointer-events: none; }
.park .layer img { width: 100%; height: auto; display: block; }
.park .layer.soon img { filter: grayscale(1) brightness(1.06) contrast(.8); }   /* sits exactly over the coloured base, so no see-through */
.park .layer:active img { transform: translateY(2px); }
.park .badge { position: absolute; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; gap: 2px; pointer-events: auto; padding: 0; border: 0; background: none; cursor: pointer; }
.park .badge b { min-width: 34px; height: 30px; padding: 0 8px; border-radius: 999px; border: 2px solid #fff; color: #fff; font-family: var(--display); font-weight: 500; font-size: .95rem; display: grid; place-items: center; box-shadow: 0 2px 4px rgba(43, 38, 32, .2); }
.park .badge.soon b { background: #E5E0EE !important; color: #8A8499; border-color: #B4ADC4; box-shadow: none; display: flex; gap: 3px; }
.park .badge.soon b img { width: 15px; height: 15px; }
.park .badge .go { background: var(--yellow); color: var(--ink); border-radius: 12px; padding: 1px 10px; font-family: var(--display); font-size: .9rem; white-space: nowrap; box-shadow: 0 3px 0 var(--yellow-deep); animation: bob 1.8s ease-in-out infinite; }
/* not built yet: a faded number in a dashed outline (a lock would suggest the lesson exists) */
.park .badge.todo b, .park .pop .no.todo { background: rgba(255, 255, 255, .7) !important; color: #B4ADC4; border: 2px dashed #B4ADC4; box-shadow: none; }
/* the child's skater waits beside the stop to play next, rolling back and forth */
/* unlock show (playUnlock) */
.park .badge.shut .go { visibility: hidden; }
.park .badge.wiggle b { animation: wiggle .5s ease-in-out 2; }
@keyframes wiggle { 25% { transform: rotate(-12deg) scale(1.1); } 75% { transform: rotate(12deg) scale(1.1); } }
.park .badge b img.fly { animation: fly .5s ease-in forwards; }
@keyframes fly { to { transform: translateY(-30px) scale(1.8); opacity: 0; } }
.park .badge.opened b { animation: popin .6s cubic-bezier(.3, 1.8, .5, 1); }
@keyframes popin { from { transform: scale(.3); } }
.park .layer.colour-in img { animation: colour-in 1s ease both; }
@keyframes colour-in { from { filter: grayscale(1) brightness(1.06) contrast(.8); } }
.park .burst { position: absolute; width: 24px; height: 24px; margin: -40px 0 0 -12px; pointer-events: none; animation: burst .9s ease-out forwards; }
@keyframes burst { from { transform: translate(0, 0) scale(.3); opacity: 1; } to { transform: translate(var(--x), var(--y)) scale(1); opacity: 0; } }
.park .ride { position: absolute; transform: translate(-50%, -88%); pointer-events: none; z-index: 1; transition: opacity .5s; }
.park .ride img { width: 100%; height: auto; display: block; filter: drop-shadow(0 5px 3px rgba(43, 38, 32, .25)); animation: roll 2.8s ease-in-out infinite; }
@keyframes roll { 50% { transform: translateX(-12%) rotate(-3deg); } }
/* the card that opens over a tapped stop */
.park .pop { position: absolute; z-index: 60; transform: translateX(-50%);   /* top is set in px by openPop */
   width: min(240px, 70%); background: var(--card); border: 2px solid var(--line); border-radius: 18px; box-shadow: 0 4px 0 var(--line), 0 10px 24px rgba(43, 38, 32, .12); padding: 12px 14px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.park .pop[hidden] { display: none; }
.park .pop .no { min-width: 40px; height: 28px; padding: 0 8px; border-radius: 999px; color: #fff; font-family: var(--display); font-weight: 500; display: grid; place-items: center; }
.park .pop .tt { font-family: var(--display); font-size: 1.05rem; line-height: 1.3; }
.park .pop .ms { display: flex; gap: 2px; }
.park .pop .ms svg { width: 22px; height: 22px; fill: #E4DAC2; stroke: #B9AF98; stroke-width: 1; }
.park .pop .ms svg.on { fill: var(--yellow); stroke: var(--yellow-deep); }
.park .pop .btn { min-height: 48px; width: 100%; font-size: 1rem; }
.park .pop .soon { display: flex; align-items: center; gap: 6px; color: var(--muted); }
.park .pop .soon img { width: 18px; height: 18px; }

@media (max-width: 760px) {
  .hero { grid-template-columns: 1fr; }
  .scene-wrap { max-width: 520px; margin: 0 auto; width: 100%; order: -1; }
  .hero-text { align-items: center; text-align: center; }
  .pill { align-self: center; }
  .hero-btns { justify-content: center; }
}
@media (max-width: 560px) {
  .stats { grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .stat { flex-direction: column; text-align: center; padding: 12px 8px; gap: 6px; }
  .lv .meter, .brand .sub { display: none; }
  .park .badge b { min-width: 0; height: 18px; padding: 0 4px; font-size: .62rem; border-width: 2px; box-shadow: none; }
  .park .badge.soon b img { display: none; }
  .park .badge .go { font-size: .75rem; padding: 0 6px; border-width: 2px; }
  .chap-nav .chap-name { min-width: 0; font-size: 1rem; }
  /* the park is too short on a phone for a card beside the stop: show it as a sheet at the bottom of the screen */
  .park .pop { position: fixed; left: 16px !important; right: 16px; top: auto !important; bottom: calc(16px + env(safe-area-inset-bottom)); width: auto; transform: none; }
  .brand .name { display: none; }
}
</style>

<div class="app" id="app">
  <header class="home-top">
    <div class="brand">
      <img class="me" src="shared/img/skate/boy.png" alt="">
      <div><div class="name">สนามเด็กเรียน</div><div class="sub">เรียนสนุก ทีละด่าน</div></div>
    </div>
    <div class="top-right">
      <button class="chip icon-btn" id="sound" title="เปิด/ปิดเสียง"></button>
      <div class="lv" id="lv"></div>
    </div>
  </header>

  <section class="hero">
    <div class="hero-text">
      <span class="pill"><b>ใหม่</b>คณิตศาสตร์ ป.4 เทอม 2</span>
      <h1>สนุกกับคณิต<br><span class="slab">ทีละด่าน</span></h1>
      <p class="lead">ดูภาพเคลื่อนไหว ลองเล่นเอง แล้วตอบคำถามเก็บดาว ผ่านทีละด่านไปจนครบทั้งเล่ม</p>
      <div class="hero-btns" id="hero-btns"></div>
    </div>
    <div class="scene-wrap">
      <div class="bubble" id="bubble">สวัสดี! วันนี้ไปผจญภัยกัน</div>
      <div class="scene">
        <img class="art" src="shared/img/hero.webp" alt="">
        <img class="spark s-tw1" src="shared/img/glowing-star.png" alt="">
        <img class="spark s-tw2 t2" src="shared/img/glowing-star.png" alt="">
        <button class="kid" id="kid" aria-label="ตัวละครของเรา แตะเพื่อฟังคำแนะนำ"><span class="ride-in"><span class="shadow"></span><img src="shared/img/skate/boy.png" alt=""></span></button>
      </div>
    </div>
  </section>

  <section class="stats" id="stats"></section>

  <section class="map-head" id="map">
    <div class="eyebrow">คณิตศาสตร์ ป.4 · เทอม 2 · ตามหนังสือเรียน</div>
  </section>
  <div class="slider" id="worlds"></div>
  <div class="chap-nav">
    <button class="arrow" id="chap-prev" aria-label="บทก่อนหน้า">‹</button>
    <span class="chap-name" id="chap-name" aria-live="polite"></span>
    <button class="arrow" id="chap-next" aria-label="บทถัดไป">›</button>
  </div>
</div>

<script src="shared/core.js"></script>
<script src="shared/parks.js"></script>
<script>
(() => {
const { COURSES, lessonId, best, store, STAR, sfx, pick, PASS, isOpen, prevId, findLesson } = L;
const $ = s => document.querySelector(s);
const star = on => STAR.replace('<svg', `<svg class="${on ? 'on' : ''}"`);

/* ---------- skate park zones, one per chapter ----------
   Each zone is a painted park picture cut up by tools/cut.html: a base picture plus one layer per stop (window.PARK_LAYOUT). */
const IMG = n => `shared/img/${n}.png`;
const SK = n => IMG('skate/' + n);
const PARK = n => `shared/img/park/${n}.webp`;

// which park zone each chapter plays in
const CHAPTER_ZONE = { 6: 'ramps', 7: 'rails', 8: 'bowl' };

/* the child's skater: the boy in the cap (no choice of character) */
const heroImg = () => SK('boy');

/* top bar: level from EXP (100 EXP per level) */
const lvl = Math.floor(store.exp / 100) + 1, into = store.exp % 100;
$('#lv').innerHTML = `<span class="badge-lv">${lvl}</span><span class="meter" aria-hidden="true"><i style="width:${into}%"></i></span><span class="exp">Lv.${lvl} · ${store.exp} EXP</span>`;
L.wireChips();

/* what to play next */
const all = [];
COURSES.forEach(c => c.chapters.forEach(ch => ch.topics.forEach(t => all.push({ c, ch, t, id: lessonId(c, t) }))));
const ready = all.filter(r => r.t.file);
// lessons open one at a time: next is the newest open one not yet passed, else the first open one short of 3 stars
const open = ready.filter(r => isOpen(r.id));
const next = open.find(r => best(r.id) < PASS) || open.find(r => best(r.id) < 3) || open[open.length - 1];
const stars = ready.reduce((s, r) => s + best(r.id), 0);
const passed = ready.filter(r => best(r.id) > 0).length;

$('#hero-btns').innerHTML = `
  <a class="btn" href="${next.t.file}">เล่นด่าน ${next.t.no}</a>
  <a class="btn ghost" href="#map">ดูแผนที่ด่าน</a>`;

$('#stats').innerHTML = [
  { ic: 'glowing-star', bg: 'var(--yellow-soft)', num: stars, lbl: 'ดาวที่เก็บได้' },
  { ic: 'skate/ramp', bg: '#DCF0E1', num: `${passed}/${all.length}`, lbl: 'ด่านที่ผ่านแล้ว' },
  { ic: 'skate/skateboard', bg: '#DCEEFA', num: store.exp, lbl: 'EXP สะสม' }
].map(s => `<div class="stat"><span class="ic" style="background:${s.bg}"><img src="${IMG(s.ic)}" alt=""></span><div><div class="num">${s.num}</div><div class="lbl">${s.lbl}</div></div></div>`).join('');

/* park maps: one 3D skate park per chapter, side by side in a swipe slider.
   Tapping a stop (its picture or number) opens a little card with the lesson name, stars and a play button. */
const LOCK = `<img src="${IMG('locked')}" alt="">`;
const worlds = [];
const slider = $('#worlds');
COURSES.forEach(c => c.chapters.forEach(ch => {
  const zone = CHAPTER_ZONE[ch.no] || 'ramps';
  const readyN = ch.topics.filter(t => t.file).length;
  const sec = document.createElement('section');
  sec.className = `world ${zone}`;
  sec.setAttribute('aria-label', `บทที่ ${ch.no} ${ch.title}`);
  sec.innerHTML = '<div class="park"></div>';
  slider.appendChild(sec);
  worlds.push({ c, ch, zone, sec, park: sec.querySelector('.park'), sub: `เปิดแล้ว ${readyN}/${ch.topics.length} ด่าน` });
}));

function drawWorld({ c, ch, zone, park }) {
  const lay = window.PARK_LAYOUT[zone], n = ch.topics.length;
  const pct = (x, y) => `left:${x}%;top:${y}%`;
  let layers = '', badges = '', ride = '';
  // nearer stops (lower on the picture) are stacked over farther ones
  const order = ch.topics.map((_, i) => i).sort((a, b) => lay.stops[a].gy - lay.stops[b].gy);
  order.forEach((i, z) => {
    const t = ch.topics[i], L = lay.stops[i], id = lessonId(c, t);
    const st = !t.file ? 'soon' : !isOpen(id) ? 'locked' : next && next.id === id ? 'next' : 'ready';
    const grey = st === 'soon' || st === 'locked';
    layers += `<button class="layer ${grey ? 'soon' : ''}" data-i="${i}" style="${pct(L.l, L.t)};width:${L.w}%;z-index:${z + 1}" aria-label="ด่าน ${t.no} ${t.title}">
        <img src="${PARK(`${zone}-${i + 1}`)}" alt=""></button>`;
    badges += `<button class="badge ${st === 'soon' ? 'todo' : grey ? 'soon' : st}" data-i="${i}" style="${pct(L.l + L.w / 2, L.t + 1)}" tabindex="-1" aria-hidden="true">
        ${st === 'next' ? '<span class="go">เริ่มตรงนี้!</span>' : ''}
        <b style="background:${ch.color}">${st === 'locked' ? LOCK : ''}${t.no}</b></button>`;
    // the child's skater stands on the floor spot just in front of the stop to play next
    if (st === 'next') ride = `<span class="ride" style="${pct(L.gx, L.gy)};width:max(34px, ${(lay.tile * 1.5).toFixed(2)}%)"><img src="${heroImg()}" alt=""></span>`;
  });
  park.style.aspectRatio = lay.aspect;
  park.innerHTML = `<img class="base" src="${PARK(zone + '-base')}" alt="">
    ${layers}<div class="over" style="z-index:${n + 2}">${ride}${badges}</div><div class="pop" hidden></div>`;
}
const drawWorlds = () => worlds.forEach(drawWorld);
drawWorlds();

/* stop card: name, stars and play (or "coming soon"), placed above the tapped stop */
function closePops() { document.querySelectorAll('.park .pop').forEach(p => (p.hidden = true)); }
// scrolling away from an open card closes it (on phones it is pinned to the bottom of the screen and would follow along)
let popY = 0;
addEventListener('scroll', () => { if (Math.abs(scrollY - popY) > 40) closePops(); }, { passive: true });
function openPop(w, i) {
  const t = w.ch.topics[i], L = window.PARK_LAYOUT[w.zone].stops[i], id = lessonId(w.c, t), s = best(id);
  const pop = w.park.querySelector('.pop');
  const x = Math.min(78, Math.max(22, L.l + L.w / 2));   // keep the card inside the park
  pop.style.left = x + '%';
  pop.innerHTML = `<b class="no${t.file ? '' : ' todo'}" style="background:${w.ch.color}">${t.no}</b><div class="tt">${t.title}</div>
    ${!t.file ? `<div class="soon">เนื้อหายังไม่พร้อม เร็วๆ นี้</div>`
      : !isOpen(id) ? `<div class="soon">${LOCK} ผ่านด่าน ${findLesson(prevId(id)).topic.no} ให้ได้ 1 ดาวก่อนนะ</div>`
      : `<div class="ms">${[0, 1, 2].map(k => star(k < s)).join('')}</div><a class="btn" href="${t.file}">เล่นด่านนี้</a>`}`;
  pop.hidden = false;
  popY = scrollY;
  if (getComputedStyle(pop).position === 'fixed') return;   // phones: a sheet at the bottom of the screen
  // The slider clips anything outside it, so measure: above the stop if the card fits there,
  // else below it, else as high as it can go while staying fully visible.
  const pr = w.park.getBoundingClientRect(), sr = slider.getBoundingClientRect(), H = pr.height, gap = 10;
  const vTop = Math.max(0, sr.top - pr.top) + 4, vBot = Math.min(H, sr.bottom - pr.top) - 4, ch = pop.offsetHeight;
  const sTop = L.t / 100 * H, sBot = (L.t + L.h) / 100 * H;
  let top = sTop - gap - ch;
  if (top < vTop) top = sBot + gap + ch <= vBot ? sBot + gap : Math.max(vTop, Math.min(vBot - ch, sTop - ch / 2));
  pop.style.top = top + 'px';
}
worlds.forEach(w => w.park.addEventListener('click', e => {
  const hit = e.target.closest('[data-i]');
  if (e.target.closest('.pop')) return;
  closePops();
  if (hit) { sfx.tap(); openPop(w, +hit.dataset.i); }
}));
document.addEventListener('click', e => { if (!e.target.closest('.park')) closePops(); });
// the card's spot is measured when it opens, so a turned iPad or a resized window closes it rather than leave it misplaced
let lastW = innerWidth;   // width only: Safari fires resize when its toolbar hides while scrolling
addEventListener('resize', () => { if (innerWidth !== lastW) { lastW = innerWidth; closePops(); } });

/* chapter slider: swipe or use the arrows; starts on the chapter of the next lesson */
let cur = -1;
function markTab(i) {
  if (i === cur) return;
  cur = i;
  $('#chap-name').innerHTML = `บทที่ ${worlds[i].ch.no} · ${worlds[i].ch.title}<small>${worlds[i].sub}</small>`;
  $('#chap-prev').disabled = i === 0;
  $('#chap-next').disabled = i === worlds.length - 1;
  closePops();
}
const goTo = (i, smooth = true) => { i = Math.max(0, Math.min(worlds.length - 1, i)); slider.scrollTo({ left: worlds[i].sec.offsetLeft - slider.offsetLeft, behavior: smooth ? 'smooth' : 'instant' }); markTab(i); };
$('#chap-prev').addEventListener('click', () => { sfx.tap(); goTo(cur - 1); });
$('#chap-next').addEventListener('click', () => { sfx.tap(); goTo(cur + 1); });
slider.addEventListener('scroll', () => markTab(Math.round(slider.scrollLeft / slider.clientWidth)), { passive: true });
goTo(Math.max(0, worlds.findIndex(w => w.ch === next.ch)), false);

/* unlock show: a quiz that has just opened the next lesson sends the child here with ?unlocked=<lesson id>.
   The stop starts locked and grey, the lock wiggles and flies off, the stop fills with colour, stars burst out,
   the skater rolls in and the stop's card opens. The address is cleaned first, so a reload does not replay it. */
const unlockId = new URLSearchParams(location.search).get('unlocked');
if (unlockId && isOpen(unlockId)) {
  history.replaceState(null, '', location.pathname + location.hash);
  const w = worlds.find(w => w.ch.topics.some(t => lessonId(w.c, t) === unlockId));
  if (w) playUnlock(w, w.ch.topics.findIndex(t => lessonId(w.c, t) === unlockId));
}
function playUnlock(w, i) {
  goTo(worlds.indexOf(w), false);
  const layer = w.park.querySelector(`.layer[data-i="${i}"]`), badge = w.park.querySelector(`.badge[data-i="${i}"]`);
  const b = badge.querySelector('b'), go = badge.querySelector('.go'), ride = w.park.querySelector('.ride');
  // the locked look to start from
  layer.classList.add('soon');
  badge.classList.add('soon', 'shut');
  b.insertAdjacentHTML('afterbegin', LOCK);
  if (ride) ride.style.opacity = 0;
  const at = (ms, fn) => setTimeout(fn, ms);
  at(300, () => w.park.scrollIntoView({ behavior: 'smooth', block: 'center' }));   // after the page has settled
  at(700, () => badge.classList.add('wiggle'));
  at(1700, () => {
    b.querySelector('img').classList.add('fly');
    layer.classList.remove('soon'); layer.classList.add('colour-in');
    badge.classList.remove('soon', 'wiggle', 'shut'); badge.classList.add('opened');
    if (go) go.textContent = 'ปลดล็อกแล้ว!';
    sfx.win();
    // a ring of little stars bursting from the badge
    const over = w.park.querySelector('.over');
    for (let k = 0; k < 8; k++) {
      const a = k / 8 * 2 * Math.PI, s = document.createElement('img');
      s.src = IMG('glowing-star'); s.alt = ''; s.className = 'burst';
      s.style.cssText = `${badge.style.cssText};--x:${Math.round(Math.cos(a) * 60)}px;--y:${Math.round(Math.sin(a) * 60)}px`;
      over.appendChild(s);
      at(1000, () => s.remove());
    }
  });
  at(2200, () => { b.querySelector('img.fly')?.remove(); if (ride) ride.style.opacity = 1; });
  at(3400, () => { if (go) go.textContent = 'เริ่มตรงนี้!'; openPop(w, i); });
}

/* hero kid: tap to jump and get a tip */
const TIPS = [
  'สวัสดี! วันนี้ไปผจญภัยกัน',
  `ด่านต่อไปคือ ${next.t.no} ${next.t.title}`,
  'ตัวล่างบอกว่าตัดเค้กกี่ชิ้น',
  'ตัวบนบอกว่าได้กี่ชิ้น',
  'ตอบถูกได้ 10 EXP นะ',
  'ครบ 100 EXP เลื่อนขั้นได้!',
  stars ? `เก็บดาวมาแล้ว ${stars} ดวง เก่งมาก!` : 'ตอบคำถามให้ได้ 3 ดาวกัน',
  'เค้กอร่อยกว่าเมื่อแบ่งเท่าๆ กัน'
];
let tip = 0, tipT = null;
const bubble = $('#bubble'), kid = $('#kid');
kid.addEventListener('click', () => {
  sfx.tap();
  kid.classList.remove('jump'); void kid.getBoundingClientRect(); kid.classList.add('jump');
  // the bubble ducks away while he jumps, then pops back with the next tip once he lands (the jump is .6s)
  bubble.classList.add('hide');
  clearTimeout(tipT);
  tipT = setTimeout(() => {
    tip = (tip + 1) % TIPS.length;
    bubble.textContent = TIPS[tip];
    bubble.classList.remove('hide', 'pop'); void bubble.offsetWidth; bubble.classList.add('pop');
  }, 600);
});
})();
</script>
