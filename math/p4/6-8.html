<script>
(() => {
const { frac, piesSeg, ri, pick, shuffle, G, B } = L;

const gcd = (a, b) => b ? gcd(b, a % b) : a;
const low = ([n, d]) => { const g = gcd(n, d); return [n / g, d / g]; };
const f = x => x[1] === 1 ? `${x[0]}` : frac(x[0], x[1]);
const fx = x => x[1] === 1 ? `<span class="num">${x[0]}</span>` : frac(x[0], x[1]);
const num = x => `<span class="num">${x}</span>`;
const txt = s => `<span class="txt">${s}</span>`;
const mix = (w, n, d) => n ? `<span class="mixed"><span class="w">${w}</span>${frac(n, d)}</span>` : num(w);
const cakes = (d, parts, o = {}) => piesSeg(d, parts, o);
const box = '<span class="box"></span>';
const sentence = (a, op, b) => `<span class="sent">${f(a)}<span class="op">${op}</span>${f(b)}<span class="op">=</span>${box}</span>`;
const NAMES = ['ขุน', 'ใบบัว', 'ต้นกล้า', 'แก้วตา'];
const who = () => shuffle(NAMES);
// a word problem, with a small tag naming the lesson it comes from
const word = (topic, s) => `<div class="qask word"><span class="topic">${topic}</span><br>${s}</div>`;
const plain = s => s.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
// the right answer plus up to 3 wrong ones whose values differ from it and from each other
function opts(right, wrong, show, val = x => x[0] / x[1]) {
  const seen = new Set([val(right)]), out = [];
  for (const w of wrong) {
    const v = val(w);
    if (out.length >= 3 || seen.has(v)) continue;
    seen.add(v); out.push(w);
  }
  return shuffle([{ html: show(right), ok: true }, ...out.map(w => ({ html: show(w), ok: false }))]);
}
const okFrac = ([n, d]) => n > 0 && d > 1;

/* ---------- 6.1 เศษส่วนแท้ เศษเกิน ---------- */
function q61a() {
  const d = ri(3, 8), cakesN = pick([1, 2]), n = cakesN === 1 ? ri(1, d - 1) : ri(d + 1, 2 * d - 1), [x] = who();
  const wrong = [[d, n], [n + 1, d], [n - 1, d], [n, d * cakesN], [d - n > 0 ? d - n : n - d, d], [n + 2, d], [n, d + 1], [n + 3, d]].filter(okFrac);
  return {
    ask: word('6.1 เศษส่วนแท้ เศษเกิน', `แม่มีเค้ก ${cakesN} ก้อน ตัดก้อนละ ${d} ชิ้นเท่าๆ กัน ${x}ได้เค้กไป ${n} ชิ้น ${x}ได้เค้กไปกี่ก้อน`),
    pic: '',
    opts: opts([n, d], wrong, f),
    explain: `ได้ ${n} ชิ้น จากก้อนที่ตัดก้อนละ ${d} ชิ้น จึงเป็น ${frac(n, d)} ก้อน (ตัวส่วนคือจำนวนชิ้นใน 1 ก้อน)`,
    after: `<div class="pair">${cakes(d, [[n, G]], { cls: 'sm' })}</div>`,
    review: `ได้ ${n} ชิ้น ก้อนละ ${d} ชิ้น = ${frac(n, d)} ก้อน`
  };
}
function q61b() {
  const d = ri(2, 9), r = Math.random(), n = r < .45 ? ri(1, d - 1) : r < .6 ? d : ri(d + 1, 2 * d), [x] = who(), imp = n >= d;
  return {
    ask: word('6.1 เศษส่วนแท้ เศษเกิน', `${x}ดื่มน้ำส้ม ${frac(n, d)} แก้ว ข้อใดถูกต้อง`),
    pic: '',
    opts: [{ html: txt('ดื่มไม่ถึง 1 แก้ว (เศษส่วนแท้)'), ok: !imp }, { html: txt('ดื่มตั้งแต่ 1 แก้วขึ้นไป (เศษเกิน)'), ok: imp }],
    explain: imp ? `ตัวเศษ ${n} ${n === d ? 'เท่ากับ' : 'มากกว่า'}ตัวส่วน ${d} จึงเป็นเศษเกิน คือ 1 แก้วขึ้นไป` : `ตัวเศษ ${n} น้อยกว่าตัวส่วน ${d} จึงเป็นเศษส่วนแท้ คือยังไม่ถึง 1 แก้ว`,
    review: `${frac(n, d)} แก้ว → ${imp ? 'เศษเกิน' : 'เศษส่วนแท้'}`
  };
}
/* ---------- 6.2 จำนวนคละ ---------- */
function q62a() {
  const d = ri(2, 8), w = ri(1, 3), r = ri(1, d - 1), n = w * d + r;
  const show = x => mix(...x), val = x => x[0] + x[1] / x[2];
  const wrong = [[w + 1, r, d], [w, Math.min(r + 1, d - 1), d], [r, w, d], [w, r, n], [w - 1, r, d], [w + 1, d - r, d], [w, r, d + 1], [w + 2, r, d]].filter(x => x[0] > 0 && x[1] > 0 && x[1] < x[2]);
  return {
    ask: word('6.2 จำนวนคละ', `มีพิซซ่าเหลือ ${frac(n, d)} ถาด เขียนเป็นจำนวนคละได้กี่ถาด`),
    pic: '',
    opts: opts([w, r, d], wrong, show, val),
    explain: `${n} ÷ ${d} = ${w} เศษ ${r} ได้เต็ม ${w} ถาด กับอีก ${frac(r, d)} ถาด คือ ${mix(w, r, d)}`,
    after: `<div class="pair">${cakes(d, [[n, G]], { cls: 'sm' })}</div>`,
    review: `${frac(n, d)} = ${mix(w, r, d)}`
  };
}
function q62b() {
  const d = ri(2, 8), w = ri(1, 3), r = ri(1, d - 1), n = w * d + r;
  const wrong = [[w + r, d], [w * r + d, d], [n + 1, d], [n - 1, d], [w * d, d], [n, d + 1], [n + 2, d], [n, d + 2]].filter(okFrac);
  return {
    ask: word('6.2 จำนวนคละ', `แม่ซื้อขนมปัง ${mix(w, r, d)} ก้อน ขนมปังแต่ละก้อนหั่นเป็น ${d} แผ่น เขียนเป็นเศษเกินได้เท่าไร`),
    pic: '',
    opts: opts([n, d], wrong, f),
    explain: `เต็ม ${w} ก้อน ได้ ${w} × ${d} = ${w * d} แผ่น รวมอีก ${r} แผ่น เป็น ${n} แผ่น จึงเป็น ${frac(n, d)} ก้อน`,
    review: `${mix(w, r, d)} = ${frac(n, d)}`
  };
}
/* ---------- 6.3 เศษส่วนที่เท่ากับจำนวนนับ ---------- */
function q63() {
  const d = ri(2, 8), k = ri(1, 4), n = k * d;
  const wrong = [k + 1, k - 1, n, d, k + 2, k + 3, n + 1, d + k].filter(x => x > 0);
  return {
    ask: word('6.3 เศษส่วนที่เท่ากับจำนวนนับ', `ร้านตัดพิซซ่าถาดละ ${d} ชิ้น วันนี้ขายไป ${n} ชิ้น คิดเป็นพิซซ่ากี่ถาด`),
    pic: '',
    opts: opts(k, wrong, num, x => x),
    explain: `${frac(n, d)} ถาด: ${n} ÷ ${d} = ${k} จึงเป็น ${k} ถาดเต็ม`,
    after: `<div class="pair">${cakes(d, [[n, G]], { cls: 'sm' })}</div>`,
    review: `${frac(n, d)} = ${k} ถาด`
  };
}
/* ---------- 6.4 เศษส่วนที่เท่ากัน ---------- */
function eqSet() {
  let n, d;
  do { d = pick([2, 3, 4, 5, 6]); n = ri(1, d - 1); } while (gcd(n, d) !== 1);
  const k = d >= 5 ? ri(2, 3) : ri(2, 4);
  return { n, d, k, N: n * k, D: d * k };
}
function q64a() {
  const m = eqSet(), [x, y] = who();
  const wrong = [m.n, m.N + 1, m.N - 1, m.n + (m.D - m.d), m.D - m.N, m.N + 2].filter(v => v > 0);
  return {
    ask: word('6.4 เศษส่วนที่เท่ากัน', `${x}กินเค้ก ${frac(m.n, m.d)} ก้อน ${y}มีเค้กขนาดเท่ากันที่ตัดเป็น ${m.D} ชิ้น ${y}ต้องกินกี่ชิ้น จึงจะได้เค้กเท่ากับ${x}`),
    pic: '',
    opts: opts(m.N, wrong, num, v => v),
    explain: `${m.d} × ${m.k} = ${m.D} ตัวเศษก็ต้องคูณ ${m.k}: ${m.n} × ${m.k} = ${m.N} จึงได้ ${frac(m.n, m.d)} = ${frac(m.N, m.D)}`,
    after: `<div class="pair">${cakes(m.d, [[m.n, G]], { cls: 'sm' })}${cakes(m.D, [[m.N, B]], { cls: 'sm' })}</div>`,
    review: `${frac(m.n, m.d)} = ${frac(m.N, m.D)} ต้องกิน ${m.N} ชิ้น`
  };
}
function q64b() {
  const m = eqSet(), [x, y] = who();
  const wrong = [[m.n + m.k - 1, m.d + m.k - 1], [m.N, m.d], [m.n, m.D], [m.N + 1, m.D], [m.N - 1, m.D], [m.n + 1, m.d + 1]].filter(([a, b]) => a > 0 && b > 1 && a < b);
  return {
    ask: word('6.4 เศษส่วนที่เท่ากัน', `${x}ทาสีรั้วไป ${frac(m.n, m.d)} ของรั้ว ${y}ทาสีรั้วอีกแผงที่ยาวเท่ากันได้เท่ากับ${x}พอดี ${y}อาจทาสีไปเท่าไร`),
    pic: '',
    opts: opts([m.N, m.D], wrong, f),
    explain: `คูณทั้งบนและล่างด้วย ${m.k}: ${frac(m.n, m.d)} = ${frac(m.N, m.D)}`,
    review: `${frac(m.n, m.d)} = ${frac(m.N, m.D)}`
  };
}
/* ---------- 6.5 เศษส่วนอย่างต่ำ ---------- */
function steps(n, d) {
  const out = [[n, d]];
  for (;;) { let k = 2; while (k <= Math.min(n, d) && (n % k || d % k)) k++; if (k > Math.min(n, d)) return out; n /= k; d /= k; out.push([n, d]); }
}
function q65() {
  let n, d, k;
  do { d = ri(2, 7); n = ri(1, d - 1); k = pick([2, 3, 4, 5, 6]); } while (gcd(n, d) !== 1 || d * k > 30);
  const N = n * k, D = d * k, mid = steps(N, D).slice(1, -1), [x] = who();
  const kind = pick(['class', 'fruit']);
  const s = kind === 'class'
    ? `ห้องของ${x}มีนักเรียน ${D} คน เป็นนักเรียนหญิง ${N} คน นักเรียนหญิงคิดเป็นเศษส่วนอย่างต่ำเท่าไรของนักเรียนทั้งห้อง`
    : `${x}มีส้ม ${D} ผล ให้เพื่อนไป ${N} ผล ส้มที่ให้ไปคิดเป็นเศษส่วนอย่างต่ำเท่าไรของส้มทั้งหมด`;
  // wrong: stopped too early (not lowest), the big one itself, the other part, only one part divided
  const wrong = [...mid, [N, D], [D - N, D], low([D - N, D]), [n, D], [N, d], [n + 1, d]].filter(okFrac);
  return {
    ask: word('6.5 เศษส่วนอย่างต่ำ', s),
    pic: '',
    opts: shuffle([{ html: f([n, d]), ok: true }, ...wrong.filter((w, i, a) => a.findIndex(v => v.join() === w.join()) === i && !(w[0] * d === w[1] * n && gcd(...w) === 1)).slice(0, 3).map(w => ({ html: f(w), ok: false }))]),
    explain: `${N} จาก ${D} คือ ${frac(N, D)} หารทั้งบนและล่างจนหารต่อไม่ได้: ${steps(N, D).map(f).join(' = ')}`,
    review: `${frac(N, D)} = ${frac(n, d)}`
  };
}
/* ---------- 6.6 การเปรียบเทียบและเรียงลำดับ ---------- */
const cmp = (a, b) => Math.sign(a[0] * b[1] - b[0] * a[1]);
function pair(kind) {
  if (kind === 'sameD') { const d = ri(3, 10); let a, b; do { a = ri(1, d - 1); b = ri(1, d - 1); } while (a === b); return [[a, d], [b, d]]; }
  if (kind === 'sameN') { const n = ri(1, 3); let c, d; do { c = ri(n + 1, 10); d = ri(n + 1, 10); } while (c === d); return [[n, c], [n, d]]; }
  let d, k, a, b;
  do { d = ri(2, 6); k = ri(2, d <= 3 ? 4 : 2); a = ri(1, d - 1); b = kind === 'eq' ? a * k : ri(1, d * k - 1); } while (d * k > 12 || (kind !== 'eq' && b === a * k));
  const p = [[a, d], [b, d * k]];
  return Math.random() < .5 ? p : p.reverse();
}
function why(a, b) {
  const s = cmp(a, b), W = { 1: 'มากกว่า', '-1': 'น้อยกว่า', 0: 'เท่ากับ' }, S = { 1: '&gt;', '-1': '&lt;', 0: '=' };
  if (a[1] === b[1]) return `ตัวส่วนเท่ากัน ดูตัวเศษ: ${f(a)} ${S[s]} ${f(b)}`;
  if (a[0] === b[0]) return `ตัวเศษเท่ากัน ตัวส่วนน้อยกว่าชิ้นใหญ่กว่า: ${f(a)} ${S[s]} ${f(b)}`;
  const L = Math.max(a[1], b[1]), A = [a[0] * L / a[1], L], Bv = [b[0] * L / b[1], L];
  return `ทำตัวส่วนเป็น ${L}: ${f(A)} ${S[s]} ${f(Bv)} จึงได้ ${f(a)} ${W[s]} ${f(b)}`;
}
function q66a() {
  const [a, b] = pair(pick(['sameD', 'sameN', 'mult', 'mult', 'eq'])), [x, y] = who(), s = cmp(a, b);
  const k = pick([['ดื่มนม', 'ลิตร', 'ดื่มนมมากกว่า', 'ดื่มเท่ากัน'], ['วิ่งได้', 'กิโลเมตร', 'วิ่งได้ไกลกว่า', 'วิ่งได้ไกลเท่ากัน'], ['กินพิซซ่า', 'ถาด', 'กินพิซซ่ามากกว่า', 'กินเท่ากัน']]);
  return {
    ask: word('6.6 การเปรียบเทียบ', `${x}${k[0]} ${f(a)} ${k[1]} ${y}${k[0]} ${f(b)} ${k[1]} ใคร${k[2]}`),
    pic: '',
    opts: [{ html: txt(x), ok: s > 0 }, { html: txt(y), ok: s < 0 }, { html: txt(k[3]), ok: s === 0 }],
    explain: why(a, b),
    review: `${f(a)} กับ ${f(b)}: ${s > 0 ? x : s < 0 ? y : k[3]}`
  };
}
const FAMILY = { 6: [2, 3, 6], 8: [2, 4, 8], 10: [2, 5, 10], 12: [2, 3, 4, 6, 12] };
function family(count) {
  for (;;) {
    const L = pick([6, 8, 10, 12]), out = [], seen = new Set();
    for (let t = 0; out.length < count && t < 50; t++) { const d = pick(FAMILY[L]), n = ri(1, d - 1), v = n * L / d; if (seen.has(v)) continue; seen.add(v); out.push([n, d]); }
    const ds = new Set(out.map(x => x[1])), big = Math.max(...ds);
    if (out.length === count && ds.size >= 2 && [...ds].every(d => big % d === 0)) return out;
  }
}
function q66b() {
  const xs = family(3), names = who().slice(0, 3), most = Math.random() < .5, L = Math.max(...xs.map(x => x[1]));
  const best = xs.reduce((m, x) => (most ? cmp(x, m) > 0 : cmp(x, m) < 0) ? x : m);
  return {
    ask: word('6.6 การเรียงลำดับ', `${names.map((n, i) => `${n}เดินได้ ${f(xs[i])} กิโลเมตร`).join(' ')} ใครเดินได้${most ? 'ไกลที่สุด' : 'น้อยที่สุด'}`),
    pic: '',
    opts: names.map((n, i) => ({ html: txt(n), ok: xs[i] === best })),
    explain: `ทำตัวส่วนเป็น ${L}: ${xs.map((x, i) => `${names[i]} ${f([x[0] * L / x[1], L])}`).join(' ')} จึงเป็น${names[xs.indexOf(best)]}`,
    review: `${xs.map(f).join(' ')} → ${most ? 'ไกลที่สุด' : 'น้อยที่สุด'}คือ ${f(best)}`
  };
}
/* ---------- 6.7 การบวก การลบ ---------- */
const KINDS = [
  { op: '+', unit: 'ถาด', text: (a, b, [x, y]) => `${x}กินพิซซ่า ${f(a)} ถาด ${y}กินอีก ${f(b)} ถาด ทั้งสองคนกินพิซซ่ารวมกันกี่ถาด` },
  { op: '+', unit: 'กิโลกรัม', text: (a, b) => `แม่ใช้แป้ง ${f(a)} กิโลกรัม ทำขนมปัง และใช้อีก ${f(b)} กิโลกรัม ทำคุกกี้ แม่ใช้แป้งทั้งหมดกี่กิโลกรัม` },
  { op: '+', unit: 'กิโลเมตร', text: (a, b, [x]) => `${x}วิ่ง ${f(a)} กิโลเมตร แล้วเดินต่ออีก ${f(b)} กิโลเมตร ${x}ไปได้ทั้งหมดกี่กิโลเมตร` },
  { op: '+', unit: 'ลิตร', text: (a, b) => `ในขวดมีน้ำ ${f(a)} ลิตร แม่เติมน้ำเพิ่มอีก ${f(b)} ลิตร ตอนนี้ในขวดมีน้ำกี่ลิตร` },
  { op: '+', unit: 'เมตร', text: (a, b, [x]) => `${x}มีเชือกสีแดงยาว ${f(a)} เมตร และเชือกสีฟ้ายาว ${f(b)} เมตร ${x}มีเชือกรวมกันกี่เมตร` },
  { op: '−', unit: 'ก้อน', text: (a, b, [x]) => `มีเค้ก ${f(a)} ก้อน ${x}กินไป ${f(b)} ก้อน เหลือเค้กกี่ก้อน` },
  { op: '−', unit: 'ลิตร', text: (a, b, [x]) => `มีนม ${f(a)} ลิตร ${x}ดื่มไป ${f(b)} ลิตร เหลือนมกี่ลิตร` },
  { op: '−', unit: 'เมตร', text: (a, b, [x, y]) => `${x}มีริบบิ้นยาว ${f(a)} เมตร ${y}มีริบบิ้นยาว ${f(b)} เมตร ${x}มีริบบิ้นยาวกว่า${y}กี่เมตร` },
  { op: '−', unit: 'กิโลเมตร', text: (a, b) => `ถนนยาว ${f(a)} กิโลเมตร ทาสีไปแล้ว ${f(b)} กิโลเมตร ยังไม่ได้ทาสีอีกกี่กิโลเมตร` },
  { op: '−', unit: 'กิโลกรัม', text: (a, b, [x]) => `${x}ซื้อส้ม ${f(a)} กิโลกรัม แบ่งให้เพื่อน ${f(b)} กิโลกรัม ${x}เหลือส้มกี่กิโลกรัม` }
];
/* two fractions whose bottoms are equal, or one a multiple of the other; for '−' a is the bigger one.
   Returns { a, b, op, L, A, Bv, r }: A and Bv are a and b over the common bottom L, r the answer over L. */
function nums(op, same = Math.random() < .5) {
  for (;;) {
    let a, b;
    if (op === '−' && Math.random() < .15) { const d = ri(3, 10); a = [1, 1]; b = [ri(1, d - 1), d]; }   // "1 whole, take away ..."
    else if (same) { const d = ri(3, 10); a = [ri(1, d - 1), d]; b = [ri(1, d - 1), d]; }
    else {
      const d = ri(2, 6), k = ri(2, 4), D = d * k;
      if (D > 12) continue;
      a = [ri(1, d - 1), d]; b = [ri(1, D - 1), D];
      if (b[0] % k === 0) continue;
      if (Math.random() < .5) [a, b] = [b, a];
    }
    const L = Math.max(a[1], b[1]), A = a[0] * L / a[1], Bv = b[0] * L / b[1];
    if (op === '−') {
      if (A === Bv) continue;
      if (A < Bv) { if (a[1] === 1) continue; return make(op, b, a); }
    } else if (A + Bv > 1.5 * L || A === Bv) continue;   // equal parts would make two of the sentence answers look the same
    return make(op, a, b);
  }
}
function make(op, a, b) {
  const L = Math.max(a[1], b[1]), A = [a[0] * L / a[1], L], Bv = [b[0] * L / b[1], L];
  return { a, b, op, L, A, Bv, r: [op === '+' ? A[0] + Bv[0] : A[0] - Bv[0], L] };
}
function wordProblem(op) {
  const kind = pick(KINDS.filter(k => k.op === op)), p = nums(op);
  return { ...p, unit: kind.unit, text: kind.text(p.a, p.b, who()) };
}
function how(p) {
  const r = low(p.r);
  const whole = p.a[1] === 1 ? `1 = ${frac(p.L, p.L)} ` : '';
  const conv = p.a[1] !== p.L && p.a[1] !== 1 ? `ทำ ${f(p.a)} = ${f(p.A)} ` : p.b[1] !== p.L ? `ทำ ${f(p.b)} = ${f(p.Bv)} ` : '';
  return `${f(p.a)} ${p.op} ${f(p.b)} : ${whole}${conv}${p.op === '+' ? 'บวก' : 'ลบ'}ตัวเศษ ${p.A[0]} ${p.op} ${p.Bv[0]} = ${p.r[0]} ได้ ${f(p.r)}`
    + (r[1] !== p.L ? ` = ${f(r)}` : '')
    + (r[0] > r[1] && r[1] > 1 ? ` = ${mix(Math.floor(r[0] / r[1]), r[0] % r[1], r[1])}` : '')
    + ` ${p.unit}`;
}
function wrongs(p) {
  const r = p.r, add = (x, y) => p.op === '+' ? x + y : x - y;
  return [
    [add(p.a[0], p.b[0]), add(p.a[1], p.b[1])],
    [p.op === '+' ? Math.abs(p.A[0] - p.Bv[0]) : p.A[0] + p.Bv[0], p.L],
    [add(p.a[0], p.b[0]), p.L],
    [r[0] + 1, r[1]], [r[0] - 1, r[1]], [r[0] + 2, r[1]], [r[0], r[1] + 1], [r[0] + 3, r[1]]
  ].filter(okFrac).map(low);
}
function q67(op) {
  const p = wordProblem(op), r = low(p.r);
  return {
    ask: word('6.7 การบวก การลบ', p.text),
    pic: '',
    opts: opts(r, wrongs(p), fx),
    explain: how(p),
    review: `${plain(p.text)} → ${f(r)} ${p.unit}`
  };
}
function q67s() {
  const p = wordProblem(pick(['+', '−'])), other = p.op === '+' ? '−' : '+';
  const [big, small] = p.op === '−' ? [p.a, p.b] : (p.A[0] >= p.Bv[0] ? [p.a, p.b] : [p.b, p.a]);
  return {
    ask: word('6.7 ประโยคสัญลักษณ์', `${p.text}<br><b>ประโยคสัญลักษณ์ข้อใดถูก</b>`),
    pic: '',
    opts: shuffle([{ html: sentence(p.a, p.op, p.b), ok: true }, { html: sentence(big, other, small), ok: false },
      p.op === '−' ? { html: sentence(p.b, '−', p.a), ok: false } : { html: sentence(small, '−', big), ok: false }]),
    explain: `${p.op === '+' ? 'เอามารวมกัน ต้องบวก' : 'หาส่วนที่เหลือหรือส่วนต่าง ต้องเอาตัวมากลบตัวน้อย'}: ${sentence(p.a, p.op, p.b)}`,
    review: `${plain(p.text)} → ${f(p.a)} ${p.op} ${f(p.b)}`
  };
}

// 20 questions in book order: 2 + 2 + 1 + 2 + 2 + 3 from 6.1-6.6, then 8 from 6.7 (3 add, 3 take away, 2 number sentences)
L.lesson({
  id: 'math-p4/6.8',
  exam: { count: 20, intro: 'โจทย์ปัญหาทบทวนเนื้อหาบทที่ 6 ทั้งหมด ตั้งแต่ 6.1 ถึง 6.7' },
  quiz: () => [q61a(), q61b(), q62a(), q62b(), q63(), q64a(), q64b(), q65(), q65(), q66a(), q66a(), q66b(),
    ...shuffle([q67('+'), q67('+'), q67('+'), q67('−'), q67('−'), q67('−'), q67s(), q67s()])]
});
})();
